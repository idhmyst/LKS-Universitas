<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAKAD NL2SQL - Universitas LKS</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            max-width: 900px; 
            margin: 30px auto; 
            padding: 0 15px; 
            color: #1f2937;
        }
        h2 {
            margin-bottom: 20px;
            color: #111827;
        }
        .input-box { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 20px; 
        }
        input { 
            flex: 1; 
            padding: 12px 14px; 
            font-size: 15px; 
            border: 1px solid #d1d5db; 
            border-radius: 6px; 
            outline: none;
        }
        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        button { 
            padding: 12px 24px; 
            font-size: 15px; 
            font-weight: 600;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer; 
            transition: background 0.15s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .sql-box { 
            background: #1e1e1e; 
            color: #5af78e; 
            padding: 14px; 
            font-family: Consolas, Monaco, "Courier New", monospace; 
            border-radius: 6px; 
            margin-bottom: 20px; 
            word-break: break-all; 
            white-space: pre-wrap;
            line-height: 1.4;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
            font-size: 14px;
        }
        th, td { 
            border: 1px solid #e5e7eb; 
            padding: 10px 12px; 
            text-align: left; 
        }
        th { 
            background: #f3f4f6; 
            font-weight: 600;
            color: #374151;
        }
        tr:nth-child(even) {
            background-color: #f9fafb;
        }
        #chart-wrapper { 
            width: 100%; 
            height: 350px; 
            position: relative;
            margin-bottom: 30px; 
            display: none;
        }
    </style>
</head>
<body>
    <h2>NLP-to-SQL Sistem Akademik Universitas LKS</h2>
    <div class="input-box">
        <input id="q" placeholder="Contoh: Tampilkan perbandingan total remunerasi tiap dosen dalam grafik batang">
        <button id="btn-send" onclick="sendQuery()">Kirim</button>
    </div>

    <div id="sql-box" class="sql-box" style="display:none;"></div>
    <div id="chart-wrapper"><canvas id="myChart"></canvas></div>
    <div id="table-container"></div>

    <script>
        let chartInstance = null;

        document.getElementById("q").addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                sendQuery();
            }
        });

        async function sendQuery() {
            const q = document.getElementById("q").value.trim();
            if (!q) return;

            const sqlBox = document.getElementById("sql-box");
            const chartWrapper = document.getElementById("chart-wrapper");
            sqlBox.style.display = "none";
            document.getElementById("table-container").innerHTML = "<p>Memuat data...</p>";

            try {
                const res = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: q })
                });
                const resData = await res.json();

                if (!res.ok) {
                    alert("Error: " + (resData.detail || "Gagal"));
                    document.getElementById("table-container").innerHTML = "";
                    return;
                }

                // Tampilkan SQL
                sqlBox.style.display = "block";
                sqlBox.textContent = "SQL: " + resData.sql;

                // Render Tabel
                renderTable(resData.columns, resData.data);

                // Render Grafik jika diminta
                if (resData.chart && resData.data && resData.data.length > 0 && resData.columns && resData.columns.length >= 2) {
                    chartWrapper.style.display = "block";
                    renderChart(resData.chartType, resData.chartTitle, resData.columns, resData.data);
                } else {
                    if (chartInstance) {
                        chartInstance.destroy();
                        chartInstance = null;
                    }
                    chartWrapper.style.display = "none";
                }
            } catch (err) {
                console.error(err);
                alert("Gagal menghubungi server.");
                document.getElementById("table-container").innerHTML = "";
            }
        }

        function renderTable(cols, rows) {
            if (!rows || rows.length === 0) {
                document.getElementById("table-container").innerHTML = "<p>Data kosong.</p>";
                return;
            }
            let html = "<table><thead><tr>" + cols.map(c => `<th>${c}</th>`).join("") + "</tr></thead><tbody>";
            rows.forEach(r => {
                html += "<tr>" + cols.map(c => `<td>${r[c] !== null ? r[c] : '-'}</td>`).join("") + "</tr>";
            });
            html += "</tbody></table>";
            document.getElementById("table-container").innerHTML = html;
        }

        function renderChart(type, title, cols, rows) {
            const ctx = document.getElementById("myChart").getContext("2d");
            if (chartInstance) chartInstance.destroy();

            // Kolom ke-1 sebagai Label (nama_dosen), Kolom ke-2 sebagai Nilai (total_remunerasi)
            const labelCol = cols[0];
            const valCol = cols[1];

            const labels = rows.map(r => r[labelCol]);
            const dataValues = rows.map(r => Number(r[valCol]));

            chartInstance = new Chart(ctx, {
                type: type || "bar",
                data: {
                    labels: labels,
                    datasets: [{
                        label: title || "Grafik Data",
                        data: dataValues,
                        backgroundColor: 'rgba(54, 162, 235, 0.6)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: { display: true, text: title || "" }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }
    </script>
</body>
</html>
